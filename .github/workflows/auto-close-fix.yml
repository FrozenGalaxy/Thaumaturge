name: Close referenced issues

on: push

permissions:
  issues: write

jobs:
  close:
    if: github.ref_type == 'branch' && github.ref_name != github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - name: Close the issues referenced by the pushed commits
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          COMMITS: ${{ toJSON(github.event.commits) }}
        run: |
          count=$(printf '%s' "$COMMITS" | jq 'if . == null then 0 else length end')
          for i in $(seq 0 $((count - 1))); do
            sha=$(printf '%s' "$COMMITS" | jq -r ".[$i].id")
            msg=$(printf '%s' "$COMMITS" | jq -r ".[$i].message")
            numbers=$(printf '%s\n' "$msg" \
              | grep -oiP '\b(close[sd]?|fix(e[sd])?|resolve[sd]?)\b\s*:?\s*((#[0-9]+)[\s,]*)+' \
              | grep -oP '#[0-9]+' | tr -d '#' | sort -un || true)
            for n in $numbers; do
              state=$(gh issue view "$n" --repo "$REPO" --json state --jq .state 2>/dev/null || echo MISSING)
              case "$state" in
                OPEN)
                  echo "Closing #$n (referenced by ${sha:0:8})"
                  gh issue close "$n" --repo "$REPO" \
                    --comment "Fixed in ${sha} on \`${BRANCH}\`."
                  ;;
                CLOSED)
                  echo "#$n is already closed - skipping"
                  ;;
                *)
                  echo "#$n could not be read - skipping"
                  ;;
              esac
            done
          done
